[workspace]
resolver = "2"
members = [ "crates/*" ]

# Reduce debug-symbol information for dependencies by default. This saves a significant amount of
# disk space on the dev profile while still retaining the ability to backtrace.
# Comment these lines out are rebuild if you need to park a debugger in the code of a dependency.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.wasm_dev]
inherits = "dev"

[profile.wasm_release]
inherits = "release"

[workspace.package]
documentation = "https://maelstrom-software.com/doc/book/latest/"
edition = "2021"
homepage = "https://maelstrom-software.com"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maelstrom-software/maelstrom"
rust-version = "1.98.1"
version = "0.15.0-dev"

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = ["no-rng", "std"] }
anstyle = "1"
anyhow = "1"
anyhow_trace = "0.1"
ascii = "1"
assert_matches = "1"
astral-tokio-tar = "0.7"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
async-trait = "0.1"
async-walkdir = "2"
atomicbox = "0.4"
base64 = "0.23"
bincode = "1"
bracoxide = "0.1"
bumpalo = { version = "3", features = ["collections"] }
byteorder = "1"
bytes = "1"
bytesize = "2"
camino = { version = "1", features = ["serde1"] }
cargo_metadata = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["cargo", "derive", "string", "wrap_help"] }
colored = "3"
colored-diff = "0.2"
combine = "4"
concat-idents = "1"
console = "0.16"
console_error_panic_hook = "0.1"
countio = { version = "0.3", features = ["tokio"] }
crossterm = { version = "0.29", default-features = false }
csv = "1"
darling = "0.24"
derivative = "2"
derive_more = { version = "2", features = ["add", "add_assign", "constructor", "debug", "deref", "deref_mut", "display", "error", "from", "into", "into_iterator"] }
eframe = "0.36"
egui = "0.36"
egui-toast = "0.22"
# Each egui_gauge 0.1.x release targets a different egui version (0.1.5 is egui 0.31, 0.1.6 is
# 0.33, 0.1.7 is 0.36), so pin the one that matches our egui.
egui_gauge = "=0.1.7"
elf = "0.8"
enum-map = { version = "3", features = ["serde"] }
enumset = { version = "1", features = ["serde"] }
fs2 = "0.4"
futures = "0.3"
futures-lite = "2"
get-size = { version = "0.1", features = ["derive"] }
globset = "0.4"
gloo-net = "0.7"
gloo-utils = "0.3"
heck = "0.5"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-tungstenite = "0.30"
hyper-util= "0.1"
indexmap = "2"
indicatif = { version = "0.18", features = ["in_memory", "tokio"] }
indoc = "2"
itertools = "0.15"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
lddtree = "0.5"
libc = "0.2"
lru = "0.18"
maelstrom-admin = { version = "0.15.0-dev", path = "crates/maelstrom-admin" }
maelstrom-base = { version = "0.15.0-dev", path = "crates/maelstrom-base" }
maelstrom-broker = { version = "0.15.0-dev", path = "crates/maelstrom-broker" }
maelstrom-client = { version = "0.15.0-dev", path = "crates/maelstrom-client" }
maelstrom-client-base = { version = "0.15.0-dev", path = "crates/maelstrom-client-base" }
maelstrom-client-process = { version = "0.15.0-dev", path = "crates/maelstrom-client-process" }
maelstrom-container = { version = "0.15.0-dev", path = "crates/maelstrom-container" }
maelstrom-fuse = { version = "0.15.0-dev", path = "crates/maelstrom-fuse" }
maelstrom-layer-fs = { version = "0.15.0-dev", path = "crates/maelstrom-layer-fs" }
maelstrom-linux = { version = "0.15.0-dev", path = "crates/maelstrom-linux" }
maelstrom-macro = { version = "0.15.0-dev", path = "crates/maelstrom-macro" }
maelstrom-plot = { version = "0.15.0-dev", path = "crates/maelstrom-plot" }
maelstrom-simex = { version = "0.15.0-dev", path = "crates/maelstrom-simex" }
maelstrom-test = { version = "0.15.0-dev", path = "crates/maelstrom-test" }
maelstrom-test-runner = { version = "0.15.0-dev", path = "crates/maelstrom-test-runner" }
maelstrom-util = { version = "0.15.0-dev", path = "crates/maelstrom-util" }
maelstrom-web = { version = "0.15.0-dev", path = "crates/maelstrom-web" }
maelstrom-worker = { version = "0.15.0-dev", path = "crates/maelstrom-worker" }
maelstrom-worker-child = { version = "0.15.0-dev", path = "crates/maelstrom-worker-child" }
maelstrom-github = { version = "0.15.0-dev", path = "crates/maelstrom-github" }
maplit = "1"
memchr = "2"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
notify = "8"
num = "0.4"
num-derive = "0.5"
num-traits = "0.2"
num_cpus = "1"
num_enum = "0.7"
oci-spec = "0.10"
paste = "1"
page_size = "0.6"
pathdiff = "0.2"
pin-project = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
pretty_assertions = "1"
proc-macro2 = "1"
prost = "0.14"
protoc-bin-vendored = "3"
quote = "1"
ratatui = { version = "0.30", features = ["scrolling-regions", "unstable-rendered-line-info"] }
rand = "0.10"
ref-cast = "1"
regex = "1"
regex-macro = "0.3"
reqwest = { version = "0.13", features = [ "blocking", "json", "stream" ] }
rstest = "0.27"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_content_ref = "0.1"
serde_json = { version = "1" }
serde_repr = "0.1"
serde_test = "1"
serde_with = { version = "3", features = ["chrono"] }
sha2 = "0.11"
slog = { version = "2", features = ["dynamic-keys", "max_level_debug", "release_max_level_debug"] }
slog-async = "2"
slog-json = "2"
slog-term = "2"
std-semaphore = "0.1"
smallvec = "1"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3", features = ["full"] }
tar = "0.4"
tempfile = "3.20"
tokio = { version = "1", features = [ "fs", "io-std", "io-util", "macros", "net", "process", "rt","rt-multi-thread", "signal", "sync", "time" ] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = [ "compat", "io" ] }
toml = "1.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tuple = "0.5"
tui-term = "0.3"
url = { version = "2", features = ["serde"] }
unicode-truncate = "3"
unicode-width = "0.2"
versions = "8"
uuid = { version = "1", features = ["v4"] }
vt100 =  "0.16"
walkdir = "2"
wasm-bindgen = "0.2"
wasm-bindgen-cli-support = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = [ "Document", "Location", "WebSocket", "Window" ] }
xdg = "3"
zerocopy = { version = "0.8", features = ["derive"] }
